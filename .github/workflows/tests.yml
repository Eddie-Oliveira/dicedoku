name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
env:
  GODOT_VERSION: "4.5-stable"
jobs:
  godot-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}
      - name: Download Godot
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -fsSL -o g.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q g.zip && rm g.zip && mv Godot_v* godot && chmod +x godot
      - name: Import project
        run: ~/godot/godot --headless --path godot --import || true
      - name: Run tests
        run: ~/godot/godot --headless --path godot --script res://tests/run_tests.gd
